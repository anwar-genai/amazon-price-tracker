<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Price Tracker Options</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px; }
    .row { margin-bottom: 12px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="text"], input[type="number"] { width: 360px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    .actions { margin-top: 16px; }
    button { padding: 8px 14px; border: none; border-radius: 4px; background: #FF9900; color: #fff; font-weight: 600; cursor: pointer; }
    .hint { color: #666; font-size: 12px; }
    .msg { margin-top: 10px; font-size: 13px; }
  </style>
  <script defer src="options.js"></script>
  </head>
<body>
  <h2>Price Tracker Settings</h2>
  <div class="row">
    <label for="apiUrl">API Base URL</label>
    <input id="apiUrl" type="text" placeholder="http://localhost:8000/api">
    <div class="hint">Used by popup and background. Must match host permissions in manifest.</div>
  </div>
  <div class="row">
    <label for="dashboardUrl">Dashboard URL</label>
    <input id="dashboardUrl" type="text" placeholder="http://localhost:8501">
  </div>
  <div class="row">
    <label for="refreshMinutes">Background refresh interval (minutes)</label>
    <input id="refreshMinutes" type="number" min="1" step="1" value="30">
  </div>
  <div class="row">
    <label><input id="enableNotifications" type="checkbox" checked> Enable price drop notifications</label>
  </div>
  <div class="row">
    <label>Quiet hours (no notifications)</label>
    <div>
      <input id="quietStart" type="time" value="22:00"> to
      <input id="quietEnd" type="time" value="07:00">
    </div>
  </div>
  <div class="row">
    <label for="minNotifyMins">Minimum minutes between notifications for the same item</label>
    <input id="minNotifyMins" type="number" min="1" step="1" value="60">
  </div>
  <div class="actions">
    <button id="saveBtn">Save</button>
    <span id="msg" class="msg"></span>
  </div>
</body>
</html>
